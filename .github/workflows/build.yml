name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PRIVACY_STRICT: '1'
    defaults:
      run:
        working-directory: memoria-source
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependencias
        run: npm ci --legacy-peer-deps

      - name: Gerar projeto Android
        run: npx expo prebuild --platform android --no-install

      - name: Compilar APK
        run: cd android && ./gradlew assembleRelease --no-daemon

      - name: Renomear APK
        run: cp android/app/build/outputs/apk/release/app-release.apk ../memorIA.apk

      - name: Publicar para download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: memorIA (versao ${{ github.run_number }})
          body: Baixe o arquivo memorIA.apk abaixo e abra no celular Android para instalar.
          files: memorIA.apk
